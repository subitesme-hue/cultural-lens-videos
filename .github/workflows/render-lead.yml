name: Render Cultural Lens lead video

on:
  workflow_dispatch:
    inputs:
      props:
        description: 'Full props JSON for one lead (from n8n). Blank = props.sample.json'
        required: false
        default: ''
      tag:
        description: 'Release tag to publish the video under (n8n polls this tag)'
        required: true
      voice:
        description: 'Kokoro voice'
        required: false
        default: 'bm_george'

permissions:
  contents: write

concurrency:
  group: lens-render-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system + Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx soundfile scipy numpy

      - name: Cache Kokoro model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Install npm deps
        run: npm ci

      - name: Write props
        env:
          PROPS: ${{ inputs.props }}
        run: |
          python3 - <<'EOF'
          import json, os
          raw = os.environ.get('PROPS', '').strip()
          props = json.loads(raw) if raw else json.load(open('props.sample.json', encoding='utf-8'))
          json.dump(props, open('props.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('audience:', props.get('audience'))
          EOF

      - name: Render
        env:
          VOICE: ${{ inputs.voice }}
        run: python3 scripts/render.py props.json out/video.mp4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          AUDIENCE=$(python3 -c "import json;print(json.load(open('props.json'))['audience'])")
          gh release create "$TAG" out/video.mp4 out/video_cover.jpg \
            --title "Cultural Lens — $AUDIENCE" --notes "Rendered by run ${{ github.run_id }}"
